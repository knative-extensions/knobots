name: "Run Gofmt and Goimport"
description: "Automatic golang formatting and import ordering"
branding:
  icon: smile
  color: green
outputs:
  log:
    description: "Report on module changes"
    value: ${{ steps.run.outputs.log }}
runs:
  using: composite
  steps:
    - name: Install goimports
      shell: bash
      env:
        GOBIN: ${{ runner.temp }}/knobots/bin
      run: |
        go install golang.org/x/tools/cmd/goimports@latest
        echo "$GOBIN" >> "$GITHUB_PATH"
    - name: Format Go code
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/entrypoint.sh"
