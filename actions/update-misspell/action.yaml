name: "Fix Misspellings"
description: "Automatic spelling correction"
branding:
  icon: pen-tool
  color: green
outputs:
  log:
    description: "Report on spelling changes"
    value: ${{ steps.run.outputs.log }}
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: knative/actions/setup-go@main
      with:
        cache: 'false'
    - name: Install misspell
      shell: bash
      env:
        GOBIN: ${{ runner.temp }}/knobots/bin
      run: |
        go install github.com/client9/misspell/cmd/misspell@latest
        echo "$GOBIN" >> "$GITHUB_PATH"
    - name: Fix misspellings
      id: run
      shell: bash
      run: |
        log=""
        create_pr="false"

        cd main

        mapfile -d '' -t files < <(find . -type d \( -name .git -o -name vendor -o -name third_party -o -name third-party \) -prune -o -type f -print0)

        if (( ${#files[@]} > 0 )); then
          # Avoid compiler-style diagnostics, which Go's problem matcher treats
          # as errors when create-pull-request prints the commit message.
          log=$(misspell -i importas -w -f '{{ .Filename }} (line {{ .Line }}, column {{ .Column }}): corrected "{{ .Original }}" to "{{ .Corrected }}"' "${files[@]}")
          [ -z "$log" ] || create_pr="true"
        else
          echo No files found.
        fi

        echo "create_pr=${create_pr}" >> "$GITHUB_ENV"

        delimiter=$(uuidgen)
        {
          echo "log<<$delimiter"
          printf '%s\n' "$log"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
